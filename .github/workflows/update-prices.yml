name: Update worth.yml prices

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run updater
        env:
          DONUT_KEY: ${{ secrets.DONUTSMP_API_KEY }}
        run: python update_worth.py "$DONUT_KEY" worth.yml

      - name: Replace worth.yml and commit
        run: |
          mv worth_updated.yml worth.yml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add worth.yml
          git commit -m "Update prices to DonutSMP auction averages" || echo "No changes"
          git push
